<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Medibook{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-white border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Medibook</a>
    <div class="ms-auto d-flex gap-2 align-items-center">
      {% if user.is_authenticated %}
        <span class="text-muted small">{{ user }}</span>
        <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}
          <button class="btn btn-outline-secondary btn-sm">Đăng xuất</button>
        </form>
      {% else %}
        <a class="btn btn-outline-primary btn-sm" href="{% url 'accounts:login' %}">Đăng nhập</a>
        <a class="btn btn-primary btn-sm" href="{% url 'accounts:register' %}">Đăng ký</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container" style="max-width: 720px;">
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %}">{{ m }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
