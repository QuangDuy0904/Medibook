<div class="d-flex justify-content-between align-items-center border-bottom py-2">
  <div>
    {% if a.queue_number %}<span class="badge text-bg-dark fs-6 me-2">{{ a.queue_number }}</span>{% endif %}
    <strong>{{ a.slot.start_at|time:"H:i" }}</strong> · {{ a.profile.full_name }}
    <span class="badge text-bg-secondary">{{ a.get_status_display }}</span>
    <div class="small text-muted">
      Mã: {{ a.code }}{% if a.source == "RECEPTION" %} · Đặt tại quầy{% endif %}
    </div>
  </div>
  {% if a.status == "CONFIRMED" %}
  <div class="d-flex gap-2">
    <a class="btn btn-success btn-sm" href="{% url 'reception:checkin_confirm' a.pk %}">Check-in</a>
    <form method="post" action="{% url 'reception:cancel' a.pk %}"
          onsubmit="return confirm('Hủy lịch hẹn này?')">{% csrf_token %}
      <button class="btn btn-outline-danger btn-sm">Hủy</button>
    </form>
  </div>
  {% endif %}
</div>
