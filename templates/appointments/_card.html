<div class="card card-hover p-3">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div class="d-flex align-items-center gap-3">
      <div class="icon-box">
        <i class="bi bi-calendar-event"></i>
      </div>
      <div>
        <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
          <strong class="text-dark">{{ a.slot.start_at|date:"d/m/Y" }} lúc {{ a.slot.start_at|time:"H:i" }}</strong>
          <span class="badge rounded-pill text-bg-{% if a.status == 'CONFIRMED' %}primary{% elif a.status == 'COMPLETED' %}success{% elif a.status == 'CANCELLED' or a.status == 'NO_SHOW' %}secondary{% else %}warning{% endif %}">
            {{ a.get_status_display }}
          </span>
        </div>
        <div class="fw-medium text-dark small">
          {{ a.slot.doctor }} · <span class="text-primary">{{ a.slot.doctor.specialty }}</span>
        </div>
        <div class="small text-muted mt-1">
          <i class="bi bi-person me-1"></i>Người khám: <strong>{{ a.profile.full_name }}</strong>
          · <i class="bi bi-qr-code ms-1 me-1"></i>Mã: <code class="text-dark">{{ a.code }}</code>
        </div>
      </div>
    </div>

    <a class="btn btn-outline-primary btn-sm px-3 text-nowrap" href="{% url 'appointments:detail' a.pk %}">
      Chi tiết & QR <i class="bi bi-chevron-right ms-1"></i>
    </a>
  </div>
</div>
