{% extends "base.html" %}
{% block title %}Đăng ký tài khoản — Medibook{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="text-center mb-4">
    <h3 class="fw-bold mb-1">Tạo tài khoản</h3>
    <p class="text-muted small">Đăng ký để đặt lịch khám và quản lý hồ sơ sức khỏe</p>
  </div>

  <div class="card p-4">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold">Tạo tài khoản</button>
    </form>

    <div class="text-center mt-3 pt-3 border-top small">
      Đã có tài khoản? <a href="{% url 'accounts:login' %}" class="fw-semibold">Đăng nhập</a>
    </div>
  </div>
</div>
{% endblock %}
